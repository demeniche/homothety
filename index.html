<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homothety</title>
<meta name="description" content="Homothety in 3D: centre, ratio k, enlargement, reduction, negative ratio. Interactive geometry app, grade 9.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23ece8df'/><path d='M5 27 L13 15 L18 23Z' fill='none' stroke='%23161616' stroke-width='2'/><path d='M5 27 L21 3 L31 19Z' fill='none' stroke='%23e2471d' stroke-width='2'/><circle cx='5' cy='27' r='3' fill='%23161616'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="topbar">
    <div class="appname">HOMOTHETY<span class="dim">&nbsp;/&nbsp;</span><span id="sceneName" class="dim"></span></div>
    <div class="top-mid">
      <button id="btnScenes" class="tb"><span data-i18n="scenes"></span> <svg viewBox="0 0 10 6" class="caret"><path d="M1 1l4 4 4-4"/></svg></button>
      <button id="btnTutorial" class="tb accent"><svg viewBox="0 0 12 12" class="ic12"><path d="M3 1.5v9l7-4.5z"/></svg><span data-i18n="tutorial"></span></button>
      <button id="btnTheory" class="tb" data-i18n="theory"></button>
    </div>
    <div class="top-right">
      <div class="langsw"><button data-lang="en">EN</button><button data-lang="uz">UZ</button></div>
      <button id="btnSettings" class="tb icon" aria-label="Settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7"/></svg></button>
    </div>
  </header>

  <!-- Tool rail -->
  <nav id="rail">
    <button class="tool" data-tool="move" data-tip="tipMove" data-key="V"><svg viewBox="0 0 20 20"><path d="M5 3l10 6-4.5 1.2L8.5 15z"/></svg></button>
    <button class="tool" data-tool="add" data-tip="tipAdd" data-key="P"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5" class="fill"/><path d="M10 2v4M10 14v4M2 10h4M14 10h4"/></svg></button>
    <button class="tool" data-tool="centre" data-tip="tipCentre" data-key="O"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5"/><path d="M10 3v14M3 10h14"/></svg></button>
    <div class="sep"></div>
    <button class="tool act" data-act="undo" data-tip="tipUndo" data-key="⌫"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3 9h9a5 5 0 010 10h-2"/></svg></button>
    <button class="tool act" data-act="clear" data-tip="tipClear"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V3.5h4V6M6 6l.8 11h6.4L14 6"/></svg></button>
    <div class="sep"></div>
    <button class="tool act" data-act="top" data-tip="tipTop" data-key="T"><svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12"/><path d="M4 8h12M8 4v12" class="thin"/></svg></button>
    <button class="tool act" data-act="iso" data-tip="tipIso" data-key="3"><svg viewBox="0 0 20 20"><path d="M10 2l7 4v8l-7 4-7-4V6z M3 6l7 4 7-4M10 10v8"/></svg></button>
    <button class="tool act" data-act="fit" data-tip="tipFit" data-key="F"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
    <button class="tool act" data-act="orbit" data-tip="tipOrbit" data-key="R"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7.5" ry="3.5"/><path d="M15 4.5l2.5 2-3 1"/></svg></button>
  </nav>

  <!-- Viewport -->
  <main id="stage">
    <div id="hud-k" class="hud"></div>
    <div id="tip" class="tooltip"></div>
  </main>

  <!-- Inspector -->
  <aside id="inspector"></aside>

  <!-- k ruler -->
  <footer id="kbar">
    <button id="btnPlay" class="playbtn" aria-label="Play"><svg viewBox="0 0 12 12"><path d="M3 1.5v9l7-4.5z"/></svg></button>
    <div class="kval"><span class="klabel">k</span><input id="kInput" type="text" inputmode="decimal" spellcheck="false"></div>
    <div id="ruler"><canvas id="rulerCanvas"></canvas></div>
  </footer>
</div>

<!-- Popovers -->
<div id="scenesPop" class="pop"></div>
<div id="settingsPop" class="pop"></div>
<div id="theoryPop" class="pop sheet"></div>

<!-- Tutorial overlay -->
<div id="coachSpot"></div>
<div id="coach" class="coach"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
