<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homothety · Interactive 3D Guide</title>
<meta name="description" content="Learn homothety (dilation) interactively: centre, ratio k, enlargement, reduction, negative ratio, properties and 3D. Geometry, grade 9.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='6' cy='26' r='3' fill='%23ffc247'/><path d='M6 26 L14 12 L20 22Z' fill='none' stroke='%234ea1ff' stroke-width='2'/><path d='M6 26 L22 2 L30 18Z' fill='none' stroke='%23ff5c7a' stroke-width='2'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="6" cy="26" r="3" class="lg-c"/><path d="M6 26 L14 12 L20 22Z" class="lg-o"/><path d="M6 26 L22 2 L30 18Z" class="lg-i"/><path d="M6 26 L22 2 M6 26 L30 18" class="lg-r"/></svg>
      </div>
      <div>
        <h1 data-i18n="appTitle">Homothety</h1>
        <p data-i18n="appSub"></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="uz">UZ</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button data-tab="learn" data-i18n="tabLearn"></button>
      <button data-tab="play" data-i18n="tabPlay"></button>
      <button data-tab="presets" data-i18n="tabPresets"></button>
      <button data-tab="settings" data-i18n="tabSettings"></button>
    </nav>

    <section class="tab-page" id="page-learn">
      <div class="progress" id="stepDots"></div>
      <div class="step-counter" id="stepCounter"></div>
      <h2 id="stepTitle"></h2>
      <div id="stepBody" class="prose"></div>
      <div id="stepTry" class="tryit"><span class="tryit-tag" data-i18n="tryIt"></span><span id="stepTryText"></span></div>
      <div class="step-nav">
        <button id="prevStep" class="btn ghost" data-i18n="prev"></button>
        <button id="nextStep" class="btn primary" data-i18n="next"></button>
      </div>
    </section>

    <section class="tab-page" id="page-play">
      <div class="field">
        <label data-i18n="tools"></label>
        <div class="seg" id="toolSeg">
          <button data-tool="move" data-i18n="toolMove"></button>
          <button data-tool="add" data-i18n="toolAdd"></button>
          <button data-tool="centre" data-i18n="toolCentre"></button>
        </div>
        <p class="hint" id="toolHint"></p>
      </div>
      <div class="field">
        <label><span data-i18n="shape"></span> · <span id="ptCount"></span></label>
        <p class="hint" id="solidNote" data-i18n="solidNote"></p>
        <div class="row">
          <button class="btn small" id="btnRemoveLast" data-i18n="removeLast"></button>
          <button class="btn small" id="btnClear" data-i18n="clear"></button>
          <button class="btn small" id="btnFlat" data-i18n="backFlat"></button>
        </div>
      </div>
      <div class="field">
        <label data-i18n="centreQuick"></label>
        <div class="row">
          <button class="btn small" data-centre="origin" data-i18n="cOrigin"></button>
          <button class="btn small" data-centre="centroid" data-i18n="cCentroid"></button>
          <button class="btn small" data-centre="vertex" data-i18n="cVertex"></button>
          <button class="btn small" data-centre="outside" data-i18n="cOutside"></button>
        </div>
      </div>
      <div class="field">
        <label data-i18n="selected"></label>
        <div id="inspector"></div>
      </div>
      <div class="field">
        <label data-i18n="show"></label>
        <div class="toggles" id="showToggles"></div>
      </div>
    </section>

    <section class="tab-page" id="page-presets">
      <div id="presetList"></div>
    </section>

    <section class="tab-page" id="page-settings">
      <div id="settingsForm"></div>
    </section>

    <footer class="foot" data-i18n="footer"></footer>
  </aside>

  <main id="stage">
    <div id="formulaCard" class="card glass"></div>
    <div class="view-tools glass">
      <button data-view="top" data-i18n="viewTop"></button>
      <button data-view="iso" data-i18n="view3d"></button>
      <button data-view="fit" data-i18n="viewFit"></button>
      <button data-view="rotate" id="btnRotate" data-i18n="viewRotate"></button>
    </div>
    <div id="measureCard" class="card glass"></div>
    <div class="kbar glass">
      <button id="btnPlay" class="btn primary play"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg><span data-i18n="play"></span></button>
      <div class="kctl">
        <div class="ktop">
          <label for="kSlider" data-i18n="kLabel"></label>
          <input id="kInput" type="number" step="0.05" min="-5" max="5">
        </div>
        <input id="kSlider" type="range" min="-3" max="3" step="0.05">
        <div class="kticks"><span>−3</span><span>−2</span><span>−1</span><span>0</span><span>1</span><span>2</span><span>3</span></div>
      </div>
      <div class="chips" id="kChips"></div>
    </div>
    <div id="kBadge" class="badge"></div>
  </main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
